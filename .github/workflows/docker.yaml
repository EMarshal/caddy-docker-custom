name: Docker Build
on:
  workflow_dispatch:
    inputs:
      push_build:
        description: 'Should the build push to the registry?'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - Dockerfile

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false
      - name: Parse Caddy version
        id: version
        run: echo "version=$(grep -Eo 'caddy:[0-9]+\.[0-9]+\.[0-9]+$' Dockerfile | cut -d ':' -f2)" | tee -a $GITHUB_OUTPUT

  docker-build:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestations with GitHub OIDC
    with:
      output: image
      push: ${{ github.event_name == 'push' || inputs.push_build == true }}
      platforms: linux/amd64,linux/arm64
      meta-images: docker.io/emarshal/caddy-custom
      meta-tags: |
        type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
        type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
