name: Lint
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/lint.yaml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/lint.yaml

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            .github/workflows/lint.yaml
          sparse-checkout-cone-mode: false
      - name: Hadolint Action
        uses: hadolint/hadolint-action@v3.4.0
